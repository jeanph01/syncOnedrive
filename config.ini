; ============================================================
; syncOnedrive - Configuration principale
; ------------------------------------------------------------
; Ce fichier centralise les paramètres techniques.
; Les scripts PS1 n'acceptent plus les chemins de cache/log/report
; en paramètres : ils sont lus ici.
; ============================================================

[general]
; Active les logs de niveau DEBUG dans les modules
verbose_mode=true

[graph]
; Application (client) ID de votre App Registration Microsoft Entra
client_id=176fc7bc-42c9-4a25-82b5-0ad584d3c061

[paths]
; Dossier racine pour tous les artefacts temporaires (cache/logs/rapports)
cache_dir=.\_cache

; Fichier de règles métier (peut être relatif à ce config.ini ou absolu)
rules_file=.\rules.json

; Noms des fichiers stockés dans cache_dir
; Cache principal OneDrive (index cloud local consommé par les scripts)
index_file=onedrive_cache.json

; Plan d'actions généré par l'organizer (déplacements/renommages prévus)
plan_file=plan.json

; Hash du cache principal pour valider la reprise d'un plan existant
cache_hash_file=cache_hash.txt

; Jeton OAuth Microsoft Graph (device code flow)
token_file=graph_token.json

; Cache local de géocodage inversé (GPS -> libellé ville/région)
gps_cache_file=gps_cache.json

; Journal des IDs cloud déjà traités (anti re-traitement)
processed_log_file=processed_ids.log

; Rapport CSV d'exécution des déplacements cloud (SUCCESS/ERROR)
execution_report_file=azure_sync_report.csv

; Log détaillé de OneDrive_PictureMovieOrganiser.ps1
organizer_log_file=organisation_log.txt

; Log détaillé de OneDrive_Sync.ps1
sync_log_file=onedrive_indexer_log.txt

; Rapport texte des doublons cloud détectés pendant le sync
sync_report_file=onedrive_doublons_rapport.txt

; Cache de hash locaux (accélère les comparaisons de fichiers locaux)
local_hash_cache_file=local_hash_cache.json

; Log détaillé de OneDrive_CloudCleaner.ps1
cloud_cleaner_log_file=onedrive_cleaner_log.txt

[organizer]
; Suffixe ajouté aux fichiers renommés
rename_marker=--odr--

; Longueur max du nom cible (hors logique de protection extension)
max_name_len=80

[sync]
; Dossier local à comparer avec le cloud
local_folder=D:\recup

[extensions]
; Extensions locales autorisées pour l'analyse du nettoyage local
allowed=.avi,.mov,.mp4,.mpg,.mpeg,.mkv,.wmv,.flv,.webm,.m4v,.3gp,.bmp,.gif,.jpg,.jpeg,.png,.svg,.tiff,.tif,.webp,.heic,.heif,.psd,.ai,.xcf,.ico,.thm,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.pdf,.rtf,.txt,.odt,.wpd,.epub,.pages,.msg,.eml,.mp3,.wav,.m4a,.flac,.amr,.opus,.html,.htm,.zip,.7z,.rar,.csv,.json,.xml
