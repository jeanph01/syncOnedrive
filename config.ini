; ============================================================
; syncOnedrive - Main configuration
; ------------------------------------------------------------
; This file centralizes technical settings.
; PS1 scripts do not accept cache/log/report paths as parameters:
; they are read from this file.
; ============================================================

[general]
; Enable DEBUG level logging in the modules
verbose_mode=true

[graph]
; Microsoft Entra App Registration client ID
client_id=176fc7bc-42c9-4a25-82b5-0ad584d3c061

[paths]
; Root folder for all temporary artifacts (cache/logs/reports)
cache_dir=.\_cache

; Business rules file (relative to this config or absolute path)
rules_file=.\rules.json

; Files stored in cache_dir
; Primary OneDrive cache (local cloud index used by scripts)
index_file=onedrive_cache.json

; Generated organizer action plan (planned moves/renames)
plan_file=plan.json

; Cache hash file to validate plan resume
cache_hash_file=cache_hash.txt

; Microsoft Graph OAuth token (device code flow)
token_file=graph_token.json

; Reverse geocoding cache (GPS -> location label)
gps_cache_file=gps_cache.json

; Cloud IDs already processed (skip duplicate work)
processed_log_file=processed_ids.log

; CSV execution report for cloud moves (SUCCESS/ERROR)
execution_report_file=azure_sync_report.csv

; Detailed organizer log file
organizer_log_file=organizer_log.txt

; Detailed sync log file
sync_log_file=onedrive_indexer_log.txt

; Duplicate report file discovered during sync
sync_report_file=onedrive_duplicates_report.txt

; Local hash cache file (speeds up local comparisons)
local_hash_cache_file=local_hash_cache.json

; Detailed cloud cleaner log file
cloud_cleaner_log_file=onedrive_cleaner_log.txt

[organizer]
; Suffix appended to renamed files
rename_marker=--ok--

; Maximum target name length (excluding extension protection logic)
max_name_len=80

[sync]
; Local folder to compare against the cloud
local_folder=E:\OneDrive
